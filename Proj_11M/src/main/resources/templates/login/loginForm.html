<!DOCTYPE html>
<html lang="ko" xmlns:th="http//www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/basic.html}">
<div layout:fragment="content">
<head>
	<title th:text="${#messages.msg('login.title')}"></title>
</head>
<body>
<form th:action="@{/login}" th:object="${loginCommand}" method="post">
	<div th:if="${#fields.hasErrors('*')}">
		<p th:each="error : ${#fields.errors('*')}" th:text="${error}"></p>
	</div>
	<p>
		<label>
			<span th:text="${#messages.msg('email')}">Email:</span><br>
			<input type="email" th:field="*{email}" />
			<div th:if="${#fields.hasErrors('email')}" th:each="error : ${#fields.errors('email')}" th:text="${error}"></div>
		</label>
	</p>
	<p>
		<label>
			<span th:text="${#messages.msg('password')}">Password:</span><br>
			<input type="password" th:field="*{password}" />
			<div th:if="${#fields.hasErrors('password')}" th:each="error : ${#fields.errors('password')}" th:text="${error}"></div>
		</label>
	</p>
	<input type="submit" th:value="${#messages.msg('login.btn')}" />
</form>
</body>
</div>
</html>
